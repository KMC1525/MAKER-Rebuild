[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maker-rebuild"
version = "0.3.0"
description = "CLI que recompila, melhora e expande jogos de RPG Maker (2000 a MZ) para HTML/CSS/JS com ajuda de IAs generativas (frontier ou locais)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rpg-maker", "html5", "game", "llm", "ollama", "cli", "recompiler", "translation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
exe = ["pyinstaller>=6"]

[project.scripts]
maker-rebuild = "maker_rebuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maker_rebuild = ["prompts/*.md", "runtime/js/*.js", "runtime/css/*.css", "runtime/html/*.tpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
